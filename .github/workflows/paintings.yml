name: Cuadros

# Descarga los cuadros de dominio público listados en src/data/masterpieces.json y los
# deja versionados en public/paintings (más los créditos). Se ejecuta al cambiar la lista
# o a mano. El commit lo hace el bot en la misma rama.
on:
  push:
    paths:
      - 'src/data/masterpieces.json'
      - 'scripts/fetch-paintings.mjs'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm install --no-save --no-package-lock sharp@0.33.5
      - run: node scripts/fetch-paintings.mjs
      - name: Commit de los cuadros
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A public/paintings src/data/masterpieceCredits.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "data: cuadros de dominio público descargados de Wikimedia Commons"
            git push
          fi
